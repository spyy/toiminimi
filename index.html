<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPyy web productions</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 200;
            letter-spacing: 2px;
            margin: 0 0 20px 0; /* Space below the title */
        }

        .contact {
            font-size: 1.1rem;
            font-weight: 300;
            color: #888;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .contact:hover {
            color: #fff; /* Brightens when hovered */
        }
    </style>
</head>
<body>

    <h1>SPyy web productions</h1>
    <a href="mailto:sami.pyy@gmail.com" class="contact">sami.pyy@gmail.com</a>

</body>
</html>
