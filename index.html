<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Rivera | Jack of All Trades</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased max-w-xl mx-auto px-4 py-8 pb-20">

    <!-- Header -->
    <header class="text-center space-y-2 mb-8">
        <div class="w-16 h-16 rounded-full bg-emerald-500 text-gray-950 font-bold text-2xl mx-auto flex items-center justify-center">AR</div>
        <h1 class="text-2xl font-bold">Alex Rivera</h1>
        <p class="text-xs text-gray-400">Digital • Creative • Mechanical • IT</p>
    </header>

    <!-- Capabilities -->
    <section class="space-y-4 mb-8">
        <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">Services</h2>
        <div class="grid grid-cols-1 gap-3">
            <div class="bg-gray-800 p-4 rounded-lg">
                <h3 class="font-bold text-sm text-emerald-400">Digital & Code</h3>
                <p class="text-xs text-gray-300 mt-1">Websites, app interfaces, custom scripts, automation.</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
                <h3 class="font-bold text-sm text-emerald-400">Design & Media</h3>
                <p class="text-xs text-gray-300 mt-1">Branding, UI design, graphics, basic video editing.</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
                <h3 class="font-bold text-sm text-emerald-400">Trades & Assembly</h3>
                <p class="text-xs text-gray-300 mt-1">Custom woodwork, repairs, installations, hardware builds.</p>
            </div>
        </div>
    </section>

    <!-- Quick Contact Form -->
    <section class="bg-gray-800 p-5 rounded-lg space-y-4">
        <h2 class="text-base font-bold">Get in Touch</h2>
        <form action="#" method="POST" class="space-y-3">
            <input type="text" placeholder="Your Name" required class="w-full p-2.5 rounded bg-gray-900 border border-gray-700 text-xs text-white focus:outline-none focus:border-emerald-500">
            <input type="email" placeholder="Your Email" required class="w-full p-2.5 rounded bg-gray-900 border border-gray-700 text-xs text-white focus:outline-none focus:border-emerald-500">
            <textarea rows="3" placeholder="What do you need built or fixed?" required class="w-full p-2.5 rounded bg-gray-900 border border-gray-700 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
            <button type="submit" class="w-full py-2.5 rounded bg-emerald-500 text-gray-950 font-bold text-xs hover:bg-emerald-400">Send Message</button>
        </form>
    </section>

</body>
</html>
